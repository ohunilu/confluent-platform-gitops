trigger:
  branches:
    include:
      - main
  paths:
    include:
      - observability/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: dynatrace-secrets
  - name: TF_VERSION
    value: '1.17.1'
  - name: TF_WORKING_DIR
    value: 'observability/dynatrace'

stages:
  - stage: Plan
    displayName: 'Terraform Plan (Observability)'
    jobs:
      - job: Plan
        steps:
          - checkout: self
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(TF_VERSION)

          - task: AzureCLI@2
            displayName: 'Terraform Init & Plan'
            inputs:
              azureSubscription: 'sc-terraform-state-backend-mi'
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -e
                export ARM_USE_OIDC=true
                export ARM_OIDC_TOKEN="$idToken"
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                cd $(TF_WORKING_DIR)
                terraform init -reconfigure
                terraform plan -out=tfplan
            env:
              TF_VAR_dynatrace_env_url: $(DYNATRACE_ENV_URL)
              TF_VAR_dynatrace_paas_token: $(DYNATRACE_PAAS_TOKEN)

          - publish: $(TF_WORKING_DIR)/tfplan
            artifact: observability-tfplan

  - stage: Apply
    displayName: 'Terraform Apply (Observability)'
    dependsOn: Plan
    condition: succeeded()
    jobs:
      - deployment: Apply
        environment: 'dynatrace-observability'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: $(TF_VERSION)
                - download: current
                  artifact: observability-tfplan

                - task: AzureCLI@2
                  displayName: 'Terraform Apply'
                  inputs:
                    azureSubscription: 'sc-terraform-state-backend-mi'
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -e
                      export ARM_USE_OIDC=true
                      export ARM_OIDC_TOKEN="$idToken"
                      export ARM_CLIENT_ID="$servicePrincipalId"
                      export ARM_TENANT_ID="$tenantId"
                      export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                      cd $(TF_WORKING_DIR)
                      terraform init -reconfigure
                      terraform apply -auto-approve $(Pipeline.Workspace)/observability-tfplan/tfplan
                  env:
                    TF_VAR_dynatrace_env_url: $(DYNATRACE_ENV_URL)
                    TF_VAR_dynatrace_paas_token: $(DYNATRACE_PAAS_TOKEN)