trigger:
  branches:
    include:
      - main
  paths:
    include:
      - platform/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: confluent-platform-secrets

  - name: TF_VERSION
    value: '1.17.1'

  - name: TF_WORKING_DIR
    value: 'platform/environments/dev'

stages:
  - stage: Plan
    displayName: 'Terraform Plan'

    jobs:
      - job: Plan

        steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(TF_VERSION)

          - task: AzureCLI@2
            displayName: 'Terraform Init & Plan'
            inputs:
              azureSubscription: 'sc-terraform-state-backend-mi'
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -e

                # Export OIDC variables for Terraform
                export ARM_USE_OIDC=true
                export ARM_OIDC_TOKEN="$idToken"
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                echo "Current Azure Account:"
                az account show

                cd $(TF_WORKING_DIR)

                terraform init -reconfigure  

                terraform state list

                terraform state rm confluent_environment.platform

                terraform state rm confluent_kafka_cluster.platform

                terraform state rm confluent_network.private-link

                terraform state rm confluent_private_link_access.azure                

                terraform state rm confluent_service_account.platform_pipeline

                terraform state rm confluent_service_account.ksqldb

                terraform state rm confluent_role_binding.platform_org_admin

                terraform state list

                terraform plan -out=tfplan
            env:
              CONFLUENT_CLOUD_API_KEY: $(CONFLUENT_CLOUD_API_KEY)
              CONFLUENT_CLOUD_API_SECRET: $(CONFLUENT_CLOUD_API_SECRET)
              TF_VAR_azure_subscription_id: $(AZURE_SUBSCRIPTION_ID)
              TF_VAR_confluent_organization_id: $(CONFLUENT_ORGANIZATION_ID)

          - publish: $(TF_WORKING_DIR)/tfplan
            artifact: tfplan

  - stage: Apply
    displayName: 'Terraform Apply'
    dependsOn: Plan
    condition: succeeded()

    jobs:
      - deployment: Apply
        environment: 'confluent-platform-dev'

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: $(TF_VERSION)

                - download: current
                  artifact: tfplan

                - task: AzureCLI@2
                  displayName: 'Terraform Apply'
                  inputs:
                    azureSubscription: 'sc-terraform-state-backend-mi'
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -e

                      # Export OIDC variables for Terraform
                      export ARM_USE_OIDC=true
                      export ARM_OIDC_TOKEN="$idToken"
                      export ARM_CLIENT_ID="$servicePrincipalId"
                      export ARM_TENANT_ID="$tenantId"
                      export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                      echo "Current Azure Account:"
                      az account show

                      cd $(TF_WORKING_DIR)

                      terraform init -reconfigure \
                        -backend-config="storage_account_name=$(TF_STATE_STORAGE_ACCOUNT)" \
                        -backend-config="container_name=tfstate" \
                        -backend-config="key=platform.tfstate"

                      terraform apply -auto-approve \
                        $(Pipeline.Workspace)/tfplan/tfplan
                  env:
                    CONFLUENT_CLOUD_API_KEY: $(CONFLUENT_CLOUD_API_KEY)
                    CONFLUENT_CLOUD_API_SECRET: $(CONFLUENT_CLOUD_API_SECRET)
                    TF_VAR_azure_subscription_id: $(AZURE_SUBSCRIPTION_ID)
                    TF_VAR_confluent_organization_id: $(CONFLUENT_ORGANIZATION_ID)