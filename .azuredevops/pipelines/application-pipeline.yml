trigger:
  branches:
    include:
      - main
  paths:
    include:
      - application/*

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: confluent-application-secrets   
  - name: TF_VERSION
    value: '1.17.1'
  - name: TF_WORKING_DIR
    value: 'application/teams/orders-app'

stages:
  - stage: Plan
    displayName: 'Terraform Plan (Application)'
    jobs:
      - job: Plan
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: $(TF_VERSION)

          - task: AzureCLI@2
            displayName: 'Terraform Init & Plan'
            inputs:
              azureSubscription: 'sc-terraform-state-backend-mi'
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -e
                export ARM_USE_OIDC=true
                export ARM_OIDC_TOKEN="$idToken"
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                cd $(TF_WORKING_DIR)
                terraform init -reconfigure
                terraform plan -out=tfplan
            env:
              TF_VAR_kafka_admin_api_key: $(KAFKA_ADMIN_API_KEY)
              TF_VAR_kafka_admin_api_secret: $(KAFKA_ADMIN_API_SECRET)
              TF_VAR_schema_registry_api_key: $(SCHEMA_REGISTRY_API_KEY)
              TF_VAR_schema_registry_api_secret: $(SCHEMA_REGISTRY_API_SECRET)

          - publish: $(TF_WORKING_DIR)/tfplan
            artifact: app-tfplan

  - stage: Apply
    displayName: 'Terraform Apply (Application)'
    dependsOn: Plan
    condition: succeeded()
    jobs:
      - deployment: Apply
        environment: 'confluent-application-dev'   
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: $(TF_VERSION)

                - download: current
                  artifact: app-tfplan

                - task: AzureCLI@2
                  displayName: 'Terraform Apply'
                  inputs:
                    azureSubscription: 'sc-terraform-state-backend-mi'
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -e
                      export ARM_USE_OIDC=true
                      export ARM_OIDC_TOKEN="$idToken"
                      export ARM_CLIENT_ID="$servicePrincipalId"
                      export ARM_TENANT_ID="$tenantId"
                      export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                      cd $(TF_WORKING_DIR)
                      terraform init -reconfigure
                      terraform apply -auto-approve $(Pipeline.Workspace)/app-tfplan/tfplan
                  env:
                    TF_VAR_kafka_admin_api_key: $(KAFKA_ADMIN_API_KEY)
                    TF_VAR_kafka_admin_api_secret: $(KAFKA_ADMIN_API_SECRET)
                    TF_VAR_schema_registry_api_key: $(SCHEMA_REGISTRY_API_KEY)
                    TF_VAR_schema_registry_api_secret: $(SCHEMA_REGISTRY_API_SECRET)